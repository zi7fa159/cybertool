version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001" # Expose backend port to host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Mount Docker socket
      # Optional: For development, you might mount source code for live reload
      # - ./backend:/usr/src/app
      # But ensure node_modules is handled correctly (e.g., using a named volume or by not mounting over it)
      # For production, code is built into the image, so live reload mount is not needed.
    environment:
      # NODE_ENV: development # Or production, depending on needs
      PORT: 3001
      # Any other backend specific environment variables
    container_name: pentest-backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"   # Expose frontend Nginx port to host (e.g., access via http://localhost)
    depends_on:
      - backend   # Ensures backend starts before frontend (optional, but good practice)
    # environment:
      # REACT_APP_API_BASE_URL: http://localhost:3001/api # This is already baked in .env or can be handled by Nginx if needed differently
      # NGINX_PORT: 80
    container_name: pentest-frontend
    restart: unless-stopped

# Optional: Define named volumes if needed for persistent data (not strictly necessary for this app's current state)
# volumes:
#   my_data:
